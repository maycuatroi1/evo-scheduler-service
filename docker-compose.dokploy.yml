services:
  scheduler-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schedulerpassword}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduler} -d ${POSTGRES_DB:-scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 20

  scheduler-redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_DEBUG=0
      - DATABASE_URL=postgres://${POSTGRES_USER:-scheduler}:${POSTGRES_PASSWORD:-schedulerpassword}@scheduler-db:5432/${POSTGRES_DB:-scheduler}
      - CELERY_BROKER_URL=redis://scheduler-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://scheduler-redis:6379/0
      - REDIS_URL=redis://scheduler-redis:6379/0
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
      - JWT_ISSUER=${JWT_ISSUER:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://scheduler.evobright.edu.vn}
    depends_on:
      scheduler-db:
        condition: service_healthy
      scheduler-redis:
        condition: service_started


  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_DEBUG=0
      - DATABASE_URL=postgres://${POSTGRES_USER:-scheduler}:${POSTGRES_PASSWORD:-schedulerpassword}@scheduler-db:5432/${POSTGRES_DB:-scheduler}
      - CELERY_BROKER_URL=redis://scheduler-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://scheduler-redis:6379/0
      - REDIS_URL=redis://scheduler-redis:6379/0
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
    depends_on:
      scheduler-db:
        condition: service_healthy
      scheduler-redis:
        condition: service_started


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://scheduler-api.evobright.edu.vn/api}
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://scheduler-api.evobright.edu.vn/api}
    depends_on:
      - backend


volumes:
  postgres_data:
